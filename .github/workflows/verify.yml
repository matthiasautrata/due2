# The PR tier (ways-of-working.md §8, §14.3): README § Verify, deterministic, on every push and PR.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: corpus admissibility and case format
        run: uv run python tools/check_corpus.py conformance/cases
      - name: vendored DPROD policies
        run: uv run python tools/check_corpus.py profiles/vendor/dprod/examples/*.ttl
      - name: ODRL 2.2 validity (SHACL)
        run: uv run python tools/check_odrl22.py --all
      - name: completion vs brute force (workflows §6.4)
        run: uv run python tools/check_completion.py
      - name: spike harness self-tests
        run: uv run pytest
      - name: strict typing
        run: uv run basedpyright
      - name: lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Markdown lint
        run: uv run rumdl check .
