[project]
name = "due2"
version = "0.1.0"
description = "Specifications and conformance suite for due2, an ODRL policy evaluation runtime"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyshacl>=0.31.0",
    "rdflib>=7.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "hypothesis>=6.170.5",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "rumdl>=0.3.0",
]

# ways-of-working.md §4: basedpyright strict, editor and gate.
# import_force.py is a run-once importer (its docstring); it is not typed.
[tool.basedpyright]
include = ["tools", "tests"]
exclude = ["tools/import_force.py"]
extraPaths = ["tools"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

# ways-of-working.md §11. Each spike lints itself (its backend.toml checks).
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["spikes"]

[tool.ruff.lint]
extend-select = ["ANN", "B", "S", "RUF", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/check_completion.py" = ["S311"]  # seeded, reproducible sampling; not cryptographic
"tools/import_force.py" = ["ANN"]
"tests/**" = ["S101"]  # pytest asserts

# The shared suite (spikes/README.md). The harness lives in tools/harness/.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["-p", "no:cacheprovider"]

# ways-of-working.md §11. Vendored suites are never edited. Paragraphs are
# one line each, so line length is not checked.
[tool.rumdl]
disable = ["MD013"]
exclude = ["conformance/external", "profiles/vendor", ".venv"]
