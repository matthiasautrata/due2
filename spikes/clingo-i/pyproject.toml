[project]
name = "clingo-i"
version = "0.1.0"
description = "due2 spike clingo-i: the semantics program (decisions/0009), interpret over the corpus"
requires-python = ">=3.14"
dependencies = [
    "clingo>=5.8.2,<5.9",
    "rdflib>=7.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "hypothesis>=6.170.5",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]
docs = [
    "clindocs>=1.5.2",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "tree-sitter>=0.25,<0.26",
]

[tool.basedpyright]
include = ["main.py", "clingo_i", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["../../tools"]  # the shared harness and check_corpus, for the acceptance tests

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["ANN", "B", "S", "RUF", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]  # pytest asserts; the protocol test runs main.py

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../tools"]
# The suite runs on every core; `loadgroup` spreads the three slow differentials over
# workers, where the default `load` queued them on one (#82). `-n 0` runs it serially.
addopts = ["-p", "no:cacheprovider", "-n", "auto", "--dist", "loadgroup"]
